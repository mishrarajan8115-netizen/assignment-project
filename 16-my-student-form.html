<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student registration form">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in your details to register.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname"
                           placeholder="Enter your full name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </p>

                <p>
                    <label for="phone">Mobile Number:</label><br>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter your mobile number" required>
                </p>

                <p>
                    <label for="dob">Date of Birth:</label><br>
                    <input type="date" id="dob" name="dob" required>
                </p>

                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </fieldset>

            <fieldset>
                <legend>Academic Information</legend>

                <p>
                    <label for="course">Select Course:</label><br>
                    <select id="course" name="course" required>
                        <option value="">-- Choose a course --</option>
                        <option value="bca">BCA</option>
                        <option value="bca-ai">BCA Artificial Intelligence</option>
                        <option value="bba">BBA</option>
                        <option value="bsc">B.Sc.</option>
                        <option value="other">Other</option>
                    </select>
                </p>

                <p>
                    <label for="qualification">Previous Qualification:</label><br>
                    <input type="text" id="qualification" name="qualification"
                           placeholder="e.g. Class 12">
                </p>

                <p>
                    <label for="address">Address:</label><br>
                    <textarea id="address" name="address" rows="4" cols="35"
                              placeholder="Enter your address"></textarea>
                </p>
            </fieldset>

            <p>
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I confirm that the information is correct.</label>
            </p>

            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>

        </form>
    </main>

    <footer>
        <p> 2026 Student Registration Form</p>
    </footer>

</body>
</html>
