```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rajan Mishra's photo gallery using CSS Grid.">
  <title>Rajan Mishra - Photo Gallery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .gallery figure {
      height: 230px;
      overflow: hidden;
      border-radius: 12px;
      position: relative;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .gallery figure:hover img {
      transform: scale(1.08);
    }

    figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Rajan Mishra's Photo Gallery</h1>
    <p>A beautiful collection of nature photographs</p>
  </header>

  <main class="gallery">

    <figure>
      <img src="https://picsum.photos/id/1015/600/400"
           alt="River and green mountains">
      <figcaption>Beautiful River</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1016/600/400"
           alt="Mountain landscape">
      <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1018/600/400"
           alt="Misty mountains">
      <figcaption>Nature</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1019/600/400"
           alt="Wooden jetty beside a lake">
      <figcaption>Peaceful Lake</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1036/600/400"
           alt="Forest landscape">
      <figcaption>Green Forest</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1039/600/400"
           alt="Waterfall in nature">
      <figcaption>Waterfall</figcaption>
    </figure>

  </main>

</body>
</html>
