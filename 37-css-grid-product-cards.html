
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive product grid using CSS Grid.">
  <title>Responsive Product Grid</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #222;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    header p {
      color: #666;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background-color: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .product-card img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .product-card h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .price {
      color: #16803c;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .product-card button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    .product-card button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>Our Products</h1>
    <p>Explore our latest products</p>
  </header>

  <main class="product-grid">

    <article class="product-card">
      <img src="https://placehold.co/300x200?text=Headphones"
           alt="Headphones">
      <h2>Headphones</h2>
      <p class="price">₹999</p>
      <button type="button">Buy Now</button>
    </article>

    <article class="product-card">
      <img src="https://placehold.co/300x200?text=Smartphone"
           alt="Smartphone">
      <h2>Smartphone</h2>
      <p class="price">₹12,999</p>
      <button type="button">Buy Now</button>
    </article>

    <article class="product-card">
      <img src="https://placehold.co/300x200?text=Smart+Watch"
           alt="Smart Watch">
      <h2>Smart Watch</h2>
      <p class="price">₹1,499</p>
      <button type="button">Buy Now</button>
    </article>

    <article class="product-card">
      <img src="https://placehold.co/300x200?text=Keyboard"
           alt="Keyboard">
      <h2>Keyboard</h2>
      <p class="price">₹799</p>
      <button type="button">Buy Now</button>
    </article>

  </main>

</body>
</html>
