<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centred Login Form</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* Student Details */
    .student-info {
      color: white;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .student-info h2 {
      margin-bottom: 5px;
    }

    /* Login Form */
    .login {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #333;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
      color: #333;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }

    .field input:focus {
      outline: 3px solid #c3b5ff;
      border-color: #764ba2;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      flex-wrap: wrap;
    }

    .row a {
      color: #764ba2;
    }

    button {
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #764ba2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5d3a85;
    }

    .footer {
      color: white;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
    }

    @media (max-width: 400px) {
      .login {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- Student Information -->
  <header class="student-info">
    <h2>Rajan Mishra</h2>
    <p>Invertis University, Bareilly</p>
    <p>Course: BCA (aI)
