<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fixing overflow that breaks a layout.">
  <title>Fixing Overflow Problems</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f0f4f8;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .wrapper {
      max-width: 700px;
      margin: 0 auto;
    }

    .student-info {
      background: #1d3557;
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .student-info h1 {
      margin-top: 0;
    }

    .column {
      width: 100%;
      padding: 1rem;
      border: 2px solid #1d3557;
      border-radius: 8px;
      margin-bottom: 1rem;
      background: white;
    }

    .long-text {
      overflow-wrap: anywhere;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .fixed-box {
      height: 90px;
      overflow-y: auto;
      border: 1px solid #999;
      padding: .5rem;
    }

    pre {
      overflow-x: auto;
      background: #f4f4f4;
      padding: .75rem;
      max-width: 100%;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .column {
        padding: 12px;
      }
    }
  </style>
</head>
