
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive website audit with mobile-friendly fixes."
  >
  <title>Responsive Audit &amp; Fixes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      padding: 1rem;
      background: #f4f6fb;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      margin-bottom: 1rem;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.75rem 1rem;
      background: #1f3a93;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
    }

    nav a:hover {
      background: #162b70;
    }

    nav a:focus-visible {
      outline: 3px solid #e94560;
      outline-offset: 3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      gap: 1rem;
    }

    .card {
      min-width: 0;
      background: #fff;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      aspect-ratio: 8 / 5;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }

    .card h2 {
      font-size: 1.25rem;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 1.5rem;
      background: #fff;
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 0.75rem;
      text-align: left;
    }

    th {
      background: #e7ecfa;
    }

    tbody tr:nth-child(even) {
      background: #f8f9fc;
    }

    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      nav a {
        flex: 1 1 auto;
      }

      .card {
        padding: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Responsive Audit – Fixed</h1>

    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#pricing">Pricing</a>
      <a href="#blog">Blog</a>
      <a href="#contact">Contact</a>
    </nav>

    <section class="grid" id="home" aria-label="Featured cards">
      <article class="card" id="services">
        <img
          src="https://picsum.photos/id/1011/800/500"
          alt="Boat on a quiet lake"
          loading="lazy"
        >
        <h2>Card One</h2>
      </article>

      <article class="card" id="blog">
        <img
          src="https://picsum.photos/id/1015/800/500"
          alt="Valley with a river"
          loading="lazy"
        >
        <h2>Card Two</h2>
      </article>

      <article class="card">
        <img
          src="https://picsum.photos/id/1016/800/500"
          alt="Rocky canyon at dusk"
          loading="lazy"
        >
        <h2>Card Three</h2>
      </article>
    </section>

    <section class="table-wrap" id="pricing" aria-label="Pricing plans">
      <table>
        <thead>
          <tr>
            <th scope="col">Plan</th>
            <th scope="col">Storage</th>
            <th scope="col">Users</th>
            <th scope="col">Support</th>
            <th scope="col">Price</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Basic</td>
            <td>10 GB</td>
            <td>1</td>
            <td>Email</td>
            <td>₹0</td>
          </tr>
          <tr>
            <td>Pro</td>
            <td>100 GB</td>
            <td>5</td>
            <td>Chat</td>
            <td>₹499</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>

</html>
